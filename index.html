        function parseTime(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function updateApp() {
            const now = new Date();
            
            // Affichage de la date et de l'heure
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('fr-FR', optionsDate);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const days = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
            const currentDay = days[now.getDay()];
            const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();

            const selectedLevel = document.getElementById('levelFilter').value;

            const imminentContainer = document.getElementById('imminent-list');
            const upcomingContainer = document.getElementById('upcoming-list');

            imminentContainer.innerHTML = '';
            upcomingContainer.innerHTML = '';

            let countImminent = 0;
            let countUpcoming = 0;

            // Filtrer par rapport au jour actuel
            const todayClasses = planningEDT.filter(item => item.jour.toLowerCase() === currentDay);

            todayClasses.forEach(item => {
                if (selectedLevel !== "ALL" && !item.classe.startsWith(selectedLevel)) {
                    return;
                }

                const finMinutes = parseTime(item.finCours);
                const diff = finMinutes - currentTotalMinutes;

                // Logique d'affichage :
                // - Si la fin est imminente (entre -5 min et +10 min par rapport à l'heure actuelle)
                if (diff >= -5 && diff <= 10) {
                    countImminent++;
                    const card = document.createElement('div');
                    card.className = "p-4 rounded-xl border bg-amber-950/20 border-amber-500/40 flex justify-between items-center transition-all animate-pulse";
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-lg font-black text-white">${item.classe}</span>
                                <span class="text-xs bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded">SORTIE IMMINENTE</span>
                            </div>
                            <span class="text-xs text-slate-300 block mt-1">Matière: ${item.matiere} • Salle: ${item.salle}</span>
                        </div>
                        <span class="text-sm font-mono font-bold text-amber-400">Fin à ${item.finCours}</span>
                    `;
                    imminentContainer.appendChild(card);
                } 
                // - Si le cours se termine plus tard dans la journée
                else if (diff > 10) {
                    countUpcoming++;
                    const card = document.createElement('div');
                    card.className = "p-3 rounded-xl border bg-slate-900/40 border-slate-800 flex justify-between items-center hover:border-slate-700 transition-all";
                    card.innerHTML = `
                        <div>
                            <span class="text-base font-bold text-white">${item.classe}</span>
                            <span class="text-xs text-slate-400 block">Matière: ${item.matiere} • Salle: ${item.salle}</span>
                        </div>
                        <span class="text-xs font-mono font-semibold text-sky-400 bg-sky-950/30 px-2.5 py-1 rounded-lg border border-sky-900/50">Fin prévue : ${item.finCours}</span>
                    `;
                    upcomingContainer.appendChild(card);
                }
            });

            document.getElementById('count-imminent').textContent = `${countImminent} classe${countImminent > 1 ? 's' : ''}`;
            document.getElementById('count-upcoming').textContent = `${countUpcoming} classe${countUpcoming > 1 ? 's' : ''}`;

            if (countImminent === 0) {
                imminentContainer.innerHTML = '<p class="text-slate-500 italic text-sm p-4 text-center">Aucune classe en train de sortir à cette heure précise.</p>';
            }
            if (countUpcoming === 0) {
                upcomingContainer.innerHTML = '<p class="text-slate-500 italic text-sm p-4 text-center">Plus de cours prévus pour aujourd\'hui (ou hors horaires).</p>';
            }
        }

        document.getElementById('levelFilter').addEventListener('change', updateApp);

        // Actualisation chaque seconde
        setInterval(updateApp, 1000);
        updateApp();
    </script>
