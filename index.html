<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Absences des Professeurs</title>
    <!-- SheetJS pour la lecture des fichiers Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --success: #2ecc71;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .clock-container {
            text-align: right;
        }

        #clock {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ecf0f1;
        }

        #date {
            font-size: 1rem;
            color: #bdc3c7;
        }

        .actions-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: var(--accent);
        }

        .btn-success {
            background-color: var(--success);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background-color: var(--primary);
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .teacher-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .teacher-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        /* Data Display */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background-color: #f1f3f5;
            color: var(--primary);
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .badge-replaced {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-absent {
            background-color: #ffebee;
            color: #c62828;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2>Tableau d'Absence des Professeurs</h2>
            <small>Suivi du jour et remplaçants</small>
        </div>
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">--/--/----</div>
        </div>
    </header>

    <div class="actions-bar">
        <label for="excelFile" class="file-label">📥 Importer Liste Excel</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">

        <button class="btn btn-secondary" onclick="openManualModal()">✏️ Gestion Manuelle des Absents</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Professeur Absent / Statut</th>
                    <th>Matière</th>
                    <th>Classe & Groupes impactés</th>
                    <th>Horaire & Durée</th>
                    <th>Remplaçant(e)</th>
                </tr>
            </thead>
            <tbody id="absencesTable">
                <!-- Données injectées dynamiquement -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal pour cocher la liste des profs -->
<div class="modal" id="manualModal">
    <div class="modal-content">
        <h3>Signaler des profs absents aujourd'hui</h3>
        <p><small>Cochez les professeurs absents pour mettre à jour la liste :</small></p>
        <div class="teacher-list" id="teachersChecklist">
            <!-- Liste générée dynamiquement -->
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button class="btn btn-danger" onclick="closeManualModal()">Annuler</button>
            <button class="btn btn-success" onclick="applyManualAbsences()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    // 1. Gestion de l'Horloge Temps Réel
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
        document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Données initiales extraites du document
    let absencesData = [
        { prof: "CLEMENT BERNARD", matiere: "MATHEMATIQUES", classe: "4E4EP1", debut: "11:10", duree: "1:00", date: "03/11/2026", remplacant: "" },
        { prof: "CAMARA DESCAMPS JACOB", matiere: "FRANCAIS", classe: "4 D (NASIRI Z., SBAIHIA R., SA KARA B., MULLIMBA R., WASSA D., REZZAG S.)", debut: "14:25", duree: "1:00", date: "03/11/2026", remplacant: "" },
        { prof: "CHIKHAOUI HENDA", matiere: "FRANCAIS", classe: "5D", debut: "09:00", duree: "1:00", date: "03/11/2026", remplacant: "GIRAUD MARGOT" },
        { prof: "CHIKHAOUI HENDA", matiere: "FRANCAIS", classe: "5D5D P2", debut: "10:10", duree: "1:00", date: "03/11/2026", remplacant: "GIRAUD MARGOT" },
        { prof: "CHIKHAOUI HENDA", matiere: "FRANCAIS", classe: "5D5D P1", debut: "11:10", duree: "1:00", date: "03/11/2026", remplacant: "GIRAUD MARGOT" },
        { prof: "HABIBES MOHAMED", matiere: "MATHEMATIQUES", classe: "5D", debut: "07:00", duree: "1:00", date: "03/11/2026", remplacant: "MOUMENIA" },
        { prof: "HABIBES MOHAMED", matiere: "MATHEMATIQUES", classe: "3E", debut: "09:00", duree: "1:00", date: "03/11/2026", remplacant: "MOUMENIA" },
        { prof: "HABIBES MOHAMED", matiere: "MATHEMATIQUES", classe: "5D5D P1", debut: "10:10", duree: "1:00", date: "03/11/2026", remplacant: "MOUMENIA" },
        { prof: "HABIBES MOHAMED", matiere: "MATHEMATIQUES", classe: "5D5D P2", debut: "11:10", duree: "1:00", date: "03/11/2026", remplacant: "MOUMENIA" },
        { prof: "HABIBES MOHAMED", matiere: "MATHEMATIQUES", classe: "4D", debut: "13:25", duree: "1:00", date: "03/11/2026", remplacant: "MOUMENIA" },
        { prof: "JOUAN FANTINE", matiere: "ANGLAIS LVI", classe: "5A5A SA KARA Baran", debut: "10:10", duree: "1:00", date: "03/11/2026", remplacant: "" },
        { prof: "JOUAN FANTINE", matiere: "ANGLAIS LVI", classe: "4-4C P2", debut: "11:30", duree: "1:00", date: "03/11/2026", remplacant: "" },
        { prof: "JOUAN FANTINE", matiere: "ANGLAIS LVI", classe: "4D", debut: "14:25", duree: "1:00", date: "03/11/2026", remplacant: "" },
        { prof: "TELAA NOUARI", matiere: "ED PHYSIQUE & SPORT", classe: "5F", debut: "11:10", duree: "1:00", date: "03/11/2026", remplacant: "" }
    ];

    // Rendu du tableau
    function renderTable() {
        const tbody = document.getElementById('absencesTable');
        tbody.innerHTML = '';

        if (absencesData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Aucune absence enregistrée.</td></tr>`;
            return;
        }

        absencesData.forEach(item => {
            const tr = document.createElement('tr');
            
            const hasRemplacant = item.remplacant && item.remplacant.trim() !== "";
            const statusBadge = hasRemplacant 
                ? `<span class="badge-replaced">Remplacé</span>` 
                : `<span class="badge-absent">Non Remplacé (Cours annulé)</span>`;

            tr.innerHTML = `
                <td><strong>${item.prof}</strong><br>${statusBadge}</td>
                <td>${item.matiere || '-'}</td>
                <td><strong>${item.classe}</strong></td>
                <td>${item.debut} (${item.duree})</td>
                <td>${hasRemplacant ? '🟢 ' + item.remplacant : '🔴 Aucun'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. Importation d'un fichier Excel (Efface et Remplace les anciennes données)
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            // Effacer et charger les nouvelles données
            absencesData = jsonData.map(row => ({
                prof: row['Professeur'] || row['PROF'] || row['Prof'] || 'Inconnu',
                matiere: row['Matière'] || row['MATIERE'] || '',
                classe: row['Classe'] || row['CLASSE'] || row['Groupe'] || 'Non spécifiée',
                debut: row['Debut'] || row['Début'] || row['Heure'] || '',
                duree: row['Duree'] || row['Durée'] || '1h',
                remplacant: row['Remplaçant'] || row['REMPLACANT'] || row['Remplacement'] || ''
            }));

            renderTable();
            alert('Nouvelle liste importée avec succès ! Les anciennes données ont été effacées.');
        };
        reader.readAsArrayBuffer(file);
    });

    // 3. Gestion manuelle des profs absents
    function openManualModal() {
        const modal = document.getElementById('manualModal');
        const listContainer = document.getElementById('teachersChecklist');
        listContainer.innerHTML = '';

        // Récupération unique des noms de profs dans les données actuelles
        const profs = [...new Set(absencesData.map(item => item.prof))];

        profs.forEach((prof, index) => {
            const item = document.createElement('div');
            item.className = 'teacher-item';
            item.innerHTML = `
                <input type="checkbox" id="prof_${index}" value="${prof}" checked>
                <label for="prof_${index}">${prof}</label>
            `;
            listContainer.appendChild(item);
        });

        modal.style.display = 'flex';
    }

    function closeManualModal() {
        document.getElementById('manualModal').style.display = 'none';
    }

    function applyManualAbsences() {
        const checkboxes = document.querySelectorAll('#teachersChecklist input[type="checkbox"]');
        const profsAbsents = Array.from(checkboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        // Filtrer les données pour ne garder que les profs cochés
        absencesData = absencesData.filter(item => profsAbsents.includes(item.prof));
        
        renderTable();
        closeManualModal();
    }

    // Premier affichage
    renderTable();
</script>

</body>
</html>
